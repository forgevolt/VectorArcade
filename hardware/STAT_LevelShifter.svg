<text x="460" y="266.0" font-size="10" text-anchor="end" font-weight="normal" fill="#000">10 kΩ</text>
<line x1="470" y1="280" x2="470" y2="335" stroke="#000" stroke-width="1.5" fill="none"/>
<line x1="560" y1="95" x2="560" y2="170" stroke="#000" stroke-width="1.5" fill="none"/>
