<text x="320" y="216.0" font-size="10" text-anchor="end" font-weight="normal" fill="#000">1 kΩ</text>
<line x1="330" y1="230" x2="330" y2="335" stroke="#000" stroke-width="1.5" fill="none"/>
<line x1="470" y1="95" x2="470" y2="120" stroke="#000" stroke-width="1.5" fill="none"/>
