<text x="584" y="205" font-size="12" text-anchor="start" font-weight="bold" fill="#000">Q1 Si2301</text>
<text x="584" y="220" font-size="10.5" text-anchor="start" font-weight="normal" fill="#444">P-MOSFET</text>
<rect x="554" y="270" width="12" height="50" stroke="#000" stroke-width="1.5" fill="#fff"/>
<text x="570" y="294.0" font-size="10" text-anchor="start" font-weight="bold" fill="#000">R4</text>
<text x="570" y="306.0" font-size="10" text-anchor="start" font-weight="normal" fill="#000">150 kΩ</text>
<line x1="560" y1="320" x2="560" y2="360" stroke="#000" stroke-width="1.5" fill="none"/>
<circle cx="560" cy="360" r="3.2" fill="#000"/>
<rect x="554" y="375" width="12" height="50" stroke="#000" stroke-width="1.5" fill="#fff"/>
<text x="570" y="399.0" font-size="10" text-anchor="start" font-weight="bold" fill="#000">R5</text>
<text x="570" y="411.0" font-size="10" text-anchor="start" font-weight="normal" fill="#000">220 kΩ</text>
<line x1="560" y1="360" x2="560" y2="375" stroke="#000" stroke-width="1.5" fill="none"/>
<line x1="560" y1="425" x2="560" y2="440" stroke="#000" stroke-width="1.5" fill="none"/>
<line x1="550" y1="440" x2="570" y2="440" stroke="#000" stroke-width="1.5" fill="none"/>
<line x1="554" y1="444" x2="566" y2="444" stroke="#000" stroke-width="1.5" fill="none"/>
<line x1="558" y1="448" x2="562" y2="448" stroke="#000" stroke-width="1.5" fill="none"/>
<line x1="560" y1="360" x2="650" y2="360" stroke="#000" stroke-width="1.5" fill="none"/>
<rect x="650" y="340" width="150" height="42" rx="3" stroke="#1f5d99" stroke-width="1.6" fill="#eef3f8"/>
<text x="660" y="357" font-size="12" text-anchor="start" font-weight="bold" fill="#1f4f82">ESP32 GPIO</text>
<text x="660" y="373" font-size="10.5" text-anchor="start" font-weight="normal" fill="#1f4f82">input, no pull-up/down</text>
<text x="570" y="354" font-size="11" text-anchor="start" font-weight="bold" fill="#7a2e00">IO_CHG</text>
<text x="20" y="478" font-size="11.5" text-anchor="start" font-weight="bold" fill="#000">STAT</text>
<text x="170" y="478" font-size="11.5" text-anchor="start" font-weight="bold" fill="#000">D1</text>
<text x="230" y="478" font-size="11.5" text-anchor="start" font-weight="bold" fill="#000">Q1</text>
<text x="330" y="478" font-size="11.5" text-anchor="start" font-weight="bold" fill="#000">IO_CHG</text>
<text x="20" y="496" font-size="11" text-anchor="start" font-weight="normal" fill="#000">low — charging</text>
<text x="170" y="496" font-size="11" text-anchor="start" font-weight="normal" fill="#000">on</text>
<text x="230" y="496" font-size="11" text-anchor="start" font-weight="normal" fill="#000">on (VGS ≈ −4.5 V)</text>
<text x="330" y="496" font-size="11" text-anchor="start" font-weight="normal" fill="#000">≈ 2.97 V (high)</text>
<text x="20" y="512" font-size="11" text-anchor="start" font-weight="normal" fill="#000">high ≈ 5 V — complete</text>
<text x="170" y="512" font-size="11" text-anchor="start" font-weight="normal" fill="#000">off</text>
<text x="230" y="512" font-size="11" text-anchor="start" font-weight="normal" fill="#000">off (VGS = 0)</text>
<text x="330" y="512" font-size="11" text-anchor="start" font-weight="normal" fill="#000">0 V</text>
<text x="20" y="528" font-size="11" text-anchor="start" font-weight="normal" fill="#000">high-impedance — no input</text>
<text x="170" y="528" font-size="11" text-anchor="start" font-weight="normal" fill="#000">off</text>
<text x="230" y="528" font-size="11" text-anchor="start" font-weight="normal" fill="#000">off (R2)</text>
<text x="330" y="528" font-size="11" text-anchor="start" font-weight="normal" fill="#000">0 V</text>
<text x="20" y="544" font-size="11" text-anchor="start" font-weight="normal" fill="#000">no battery: toggles ≈ 40 ms</text>
<text x="170" y="544" font-size="11" text-anchor="start" font-weight="normal" fill="#000">flickers</text>
<text x="230" y="544" font-size="11" text-anchor="start" font-weight="normal" fill="#000">toggles</text>
<text x="330" y="544" font-size="11" text-anchor="start" font-weight="normal" fill="#000">toggles → firmware counts edges</text>
<text x="20" y="560" font-size="11" text-anchor="start" font-weight="normal" fill="#000">USB unplugged (VBUS = 0)</text>
<text x="170" y="560" font-size="11" text-anchor="start" font-weight="normal" fill="#000">off</text>
<text x="230" y="560" font-size="11" text-anchor="start" font-weight="normal" fill="#000">off</text>
<text x="330" y="560" font-size="11" text-anchor="start" font-weight="normal" fill="#000">0 V, no battery drain</text>
<text x="560" y="478" font-size="10.5" text-anchor="start" font-weight="normal" fill="#555">IO_CHG = VBUS × R5 / (R4 + R5):</text>
<text x="560" y="494" font-size="10.5" text-anchor="start" font-weight="normal" fill="#555">2.82 V at 4.75 V, 3.27 V at 5.5 V —</text>
<text x="560" y="510" font-size="10.5" text-anchor="start" font-weight="normal" fill="#555">above VIH, below the 3.6 V maximum.</text>
<text x="560" y="530" font-size="10.5" text-anchor="start" font-weight="normal" fill="#555">R4/R5 large: with the console off and</text>
<text x="560" y="546" font-size="10.5" text-anchor="start" font-weight="normal" fill="#555">the cell charging, ≤ ~28 µA reach the</text>
<text x="560" y="562" font-size="10.5" text-anchor="start" font-weight="normal" fill="#555">unpowered ESP32 (15k/22k: ~0.28 mA).</text>
</svg>