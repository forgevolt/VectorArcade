<text x="115.0" y="384" font-size="10" text-anchor="middle" font-weight="normal" fill="#444">charger</text>
<text x="115" y="313" font-size="9.5" text-anchor="middle" font-weight="bold" fill="#1f4f82">VDD</text>
<text x="185" y="339" font-size="9.5" text-anchor="end" font-weight="bold" fill="#1f4f82">STAT</text>
<text x="115" y="415" font-size="9.5" text-anchor="middle" font-weight="bold" fill="#1f4f82">VSS</text>
