<svg xmlns="http://www.w3.org/2000/svg" width="820" height="600" viewBox="0 0 820 600" font-family="Helvetica, Arial, sans-serif">
<rect width="820" height="600" fill="#ffffff"/>
<text x="20" y="28" font-size="17" text-anchor="start" font-weight="bold" fill="#000">MCP73831 STAT → ESP32 input — P-MOSFET level shifter and charge LED</text>
<text x="20" y="48" font-size="12" text-anchor="start" font-weight="normal" fill="#555">STAT never reaches the ESP32: Q1 turns STAT-low into about 3 V at a digital input; D1 shows charging on its own</text>
