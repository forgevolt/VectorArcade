<rect x="464" y="120" width="12" height="50" stroke="#000" stroke-width="1.5" fill="#fff"/>
<text x="460" y="144.0" font-size="10" text-anchor="end" font-weight="bold" fill="#000">R2</text>
<text x="460" y="156.0" font-size="10" text-anchor="end" font-weight="normal" fill="#000">100 kΩ</text>
<line x1="470" y1="170" x2="470" y2="200" stroke="#000" stroke-width="1.5" fill="none"/>
